<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAYAN Company (BCT) - Communication Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root {
            --primary-gold: #b38f4f;
            --dark-gold: #8e6f37;
            --dark-bg: #111111;
            --card-bg: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --success-green: #2ecc71;
            --error-red: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; overflow: hidden; }

        .portal-container { background-color: var(--card-bg); width: 100%; max-width: 420px; padding: 30px 20px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); border: 1px solid var(--border-color); text-align: center; }
        .dashboard-container { display: none; background-color: var(--card-bg); width: 100%; max-width: 900px; height: 85vh; border-radius: 12px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); border: 1px solid var(--border-color); grid-template-columns: 260px 1fr; overflow: hidden; }

        .logo-area { margin-bottom: 20px; }
        .logo-icon { font-size: 54px; font-weight: bold; color: var(--primary-gold); line-height: 1; margin-bottom: 5px; font-family: 'Times New Roman', Times, serif; }
        .company-name { font-size: 22px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .company-subtext { font-size: 13px; color: var(--primary-gold); letter-spacing: 3px; font-weight: bold; margin-top: 2px; }
        .portal-title { font-size: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--primary-gold); margin-bottom: 8px; }
        .input-group select, .input-group input { width: 100%; padding: 12px; background-color: #222; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 16px; }
        .input-group select:focus, .input-group input:focus { outline: none; border-color: var(--primary-gold); }
        .login-btn { width: 100%; padding: 14px; background-color: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .login-btn:hover { background-color: var(--dark-gold); color: #fff; }

        #message-box { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; display: none; }
        .error { background-color: rgba(231, 76, 60, 0.15); color: var(--error-red); border: 1px solid var(--error-red); }

        .sidebar { background-color: #111; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .mini-logo { font-size: 22px; font-weight: bold; color: var(--primary-gold); margin-bottom: 15px; }
        .user-badge { background: #222; padding: 10px; border-radius: 6px; border-left: 3px solid var(--primary-gold); margin-bottom: 15px; font-size: 13px; }
        .channels-list h4 { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px;}
        .channel-item { padding: 10px; border-radius: 6px; background: #1a1a1a; font-size: 13px; color: var(--primary-gold); font-weight: bold; border: 1px solid var(--border-color); margin-bottom: 15px; }
        .active-users-box { flex: 1; display: flex; flex-direction: column; margin-bottom: 15px; }
        .active-users-box h4 { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px; }
        .users-list { display: flex; flex-direction: column; gap: 6px; }
        .logout-btn { padding: 10px; background: transparent; border: 1px solid var(--error-red); color: var(--error-red); border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; min-height: 40px; }
        .logout-btn:hover { background: var(--error-red); color: #fff; }

        .chat-area { display: flex; flex-direction: column; background: #161616; min-height: 0; }
        .chat-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); font-weight: bold; display: flex; justify-content: space-between; align-items: center;}
        .status-dot { width: 8px; height: 8px; background: var(--success-green); border-radius: 50%; display: inline-block; margin-right: 5px; }
        .mobile-toggle-btn { display: none; background: #222; border: 1px solid var(--primary-gold); color: var(--primary-gold); padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        .messages-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
        
        /* Message Styling */
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; line-height: 1.4; font-size: 14px; word-break: break-word; position: relative; }
        .msg.received { background: #222; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--border-color); }
        .msg.sent { background: var(--primary-gold); color: #111; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 500; }
        .msg-meta { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; display: block; }
        .msg.sent .msg-meta { color: #333; font-weight: bold; }
        
        /* Fixed Delete Button positioning: Inside bubble, on the right */
        .delete-btn { position: absolute; right: 5px; top: 5px; cursor: pointer; color: #111; font-size: 12px; opacity: 0.6; display: none; }
        .msg.sent:hover .delete-btn { display: block; }

        .input-bar { padding: 15px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; gap: 8px; flex-shrink: 0; }
        .input-bar input { flex: 1; padding: 12px; background: #111; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 16px; }
        .send-btn { padding: 0 20px; background: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-weight: bold; cursor: pointer; font-size: 15px; }

        @media (max-width: 768px) {
            body { padding: 0; }
            .portal-container { border-radius: 0; border: none; height: 100vh; }
            .dashboard-container { grid-template-columns: 1fr; height: 100vh; border-radius: 0; border: none; }
            .sidebar { display: none; position: absolute; top: 55px; left: 0; right: 0; bottom: 0; z-index: 10; background: #111; }
            .sidebar.active { display: flex; }
            .mobile-toggle-btn { display: block; }
        }
    </style>
</head>
<body>

    <div class="portal-container" id="loginScreen">
        <div class="logo-area">
            <div class="logo-icon">B</div>
            <div class="company-name">Bayan Company</div>
            <div class="company-subtext">BCT</div>
        </div>
        <h2 class="portal-title">Secure Communications Portal</h2>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="portal-id">Select Identity</label>
                <select id="portal-id" required>
                    <option value="" disabled selected>-- Select Member --</option>
                    <option value="Eng. Ahmed Nabil">Eng. Ahmed Nabil</option>
                    <option value="Eng. Youssef Nabil">Eng. Youssef Nabil</option>
                    <option value="Eng. Noha Alhaddad">Eng. Noha Alhaddad</option>
                    <option value="Eng. Nabil Hassan">Eng. Nabil Hassan</option>
                </select>
            </div>
            <div class="input-group">
                <label for="password">Security Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Secure Login</button>
        </form>
        <div id="message-box"></div>
    </div>

    <div class="dashboard-container" id="dashboardScreen">
        <aside class="sidebar" id="sidebarMenu">
            <div class="mini-logo">BCT Portal</div>
            <div class="user-badge"><span style="color: var(--primary-gold); font-weight: bold;">User:</span> <div id="displayUser"></div></div>
            <div class="channels-list">
                <h4>Active Channel</h4>
                <div class="channel-item">📢 company-wide</div>
            </div>
            <div class="active-users-box">
                <h4>Online Personnel</h4>
                <div class="users-list" id="presenceList"></div>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Disconnect</button>
        </aside>

        <main class="chat-area">
            <div class="chat-header">
                <button class="mobile-toggle-btn" onclick="toggleMobileMenu()" id="menuToggleBtn">👥 Online</button>
                <div id="chatRoomTitle">Bayan Feed</div>
                <div style="font-size: 12px; color: var(--text-muted);"><span class="status-dot"></span> Secure</div>
            </div>
            <div class="messages-window" id="messagesWindow"></div>
            <form class="input-bar" onsubmit="sendMessage(event)">
                <input type="text" id="typeBox" placeholder="Type a message..." autocomplete="off" required>
                <button type="submit" class="send-btn">Send</button>
            </form>
        </main>
    </div>

    <script>
        const userCredentials = { 'Eng. Ahmed Nabil': 'Bayan2026', 'Eng. Youssef Nabil': 'Bayan2026', 'Eng. Noha Alhaddad': 'Bayan2026', 'Eng. Nabil Hassan': 'Bayan2026' };
        let currentActiveUser = "", client = null, deviceSessionToken = "dev_" + Math.random().toString(16).substr(2, 8);
        const CHAT_TOPIC = "bayan/company/bct_broadcast_channel_main";
        const PRESENCE_TOPIC = "bayan/company/presence/";
        let onlineUsers = {};

        // Force offline status when closing window
        window.addEventListener('beforeunload', () => {
            if (client) client.publish(PRESENCE_TOPIC + currentActiveUser, JSON.stringify({status: "offline", user: currentActiveUser}), {retain: true});
        });

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebarMenu');
            sidebar.classList.toggle('active');
            document.getElementById('menuToggleBtn').innerText = sidebar.classList.contains('active') ? "❌ Close" : "👥 Online";
        }

        function renderPresenceList() {
            const listDiv = document.getElementById('presenceList');
            listDiv.innerHTML = "";
            Object.keys(onlineUsers).forEach(user => {
                listDiv.insertAdjacentHTML('beforeend', `<div style="font-size: 12px; color: #fff; padding: 4px 0;"><span class="status-dot"></span> ${user}</div>`);
            });
        }

        function handleLogin(event) {
            event.preventDefault();
            const selectedId = document.getElementById('portal-id').value;
            if (userCredentials[selectedId] === document.getElementById('password').value) {
                currentActiveUser = selectedId;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'grid';
                document.getElementById('displayUser').innerText = selectedId;
                initLiveSync();
            } else {
                const box = document.getElementById('message-box');
                box.className = "error"; box.innerText = "Invalid Password."; box.style.display = "block";
            }
        }

        function displayIncomingMessage(sender, message, isSelf = false) {
            const windowObj = document.getElementById('messagesWindow');
            const msgId = 'msg-' + Date.now() + Math.random(); 
            const deleteHtml = isSelf ? `<span class="delete-btn" onclick="document.getElementById('${msgId}').remove()">✕</span>` : '';
            
            windowObj.insertAdjacentHTML('beforeend', `
                <div class="msg ${isSelf ? 'sent' : 'received'}" id="${msgId}">
                    ${deleteHtml}
                    <span class="msg-meta">${sender}</span>
                    <div>${message}</div>
                </div>`);
            windowObj.scrollTop = windowObj.scrollHeight;
        }

        function initLiveSync() {
            client = mqtt.connect('ws://broker.hivemq.com:8000/mqtt', {
                clientId: 'bct_' + Math.random().toString(16).substr(2, 8),
                will: { topic: PRESENCE_TOPIC + currentActiveUser, payload: JSON.stringify({status: "offline", user: currentActiveUser}), retain: true }
            });

            client.on('connect', () => {
                client.subscribe(CHAT_TOPIC);
                client.subscribe(PRESENCE_TOPIC + "+");
                client.publish(PRESENCE_TOPIC + currentActiveUser, JSON.stringify({status: "online", user: currentActiveUser}), {retain: true});
            });

            client.on('message', (topic, payload) => {
                const data = JSON.parse(payload.toString());
                if (topic.startsWith(PRESENCE_TOPIC)) {
                    if (data.status === "online") onlineUsers[data.user] = true;
                    else delete onlineUsers[data.user];
                    renderPresenceList();
                } else if (topic === CHAT_TOPIC && data.token !== deviceSessionToken) {
                    displayIncomingMessage(data.user, data.message, false);
                }
            });
        }

        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('typeBox');
            if (input.value.trim() === "" || !client) return;
            client.publish(CHAT_TOPIC, JSON.stringify({ token: deviceSessionToken, user: currentActiveUser, message: input.value }));
            displayIncomingMessage("You", input.value, true);
            input.value = "";
        }

        function handleLogout() {
            client.publish(PRESENCE_TOPIC + currentActiveUser, JSON.stringify({status: "offline", user: currentActiveUser}), {retain: true});
            location.reload();
        }
    </script>
</body>
</html>
