<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAYAN Company (BCT) - Communication Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root {
            --primary-gold: #b38f4f;
            --dark-gold: #8e6f37;
            --dark-bg: #111111;
            --card-bg: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --success-green: #2ecc71;
            --error-red: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .portal-container { background-color: var(--card-bg); width: 100%; max-width: 420px; padding: 30px 20px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; }
        .dashboard-container { display: none; width: 100%; max-width: 900px; height: 85vh; background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); grid-template-columns: 260px 1fr; overflow: hidden; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; text-transform: uppercase; color: var(--primary-gold); margin-bottom: 8px; }
        .input-group select, .input-group input { width: 100%; padding: 12px; background-color: #222; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 16px; }
        .login-btn { width: 100%; padding: 14px; background-color: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        .chat-area { display: flex; flex-direction: column; background: #161616; min-height: 0; }
        .messages-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; font-size: 14px; position: relative; }
        .msg.received { background: #222; align-self: flex-start; border: 1px solid var(--border-color); }
        .msg.sent { background: var(--primary-gold); color: #111; align-self: flex-end; }
        
        .delete-btn { position: absolute; right: 5px; top: 5px; cursor: pointer; color: #000; font-weight: bold; font-size: 12px; display: none; }
        .msg.sent:hover .delete-btn { display: block; }

        .input-bar { padding: 15px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
        .input-bar input { flex: 1; padding: 12px; background: #111; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; }
        .send-btn { padding: 0 20px; background: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="portal-container" id="loginScreen">
        <h2>Bayan Company (BCT)</h2>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <select id="portal-id" required>
                    <option value="" disabled selected>-- Select Member --</option>
                    <option value="Eng. Ahmed Nabil">Eng. Ahmed Nabil</option>
                    <option value="Eng. Youssef Nabil">Eng. Youssef Nabil</option>
                    <option value="Eng. Noha Alhaddad">Eng. Noha Alhaddad</option>
                    <option value="Eng. Nabil Hassan">Eng. Nabil Hassan</option>
                </select>
            </div>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="login-btn" style="margin-top:20px">Secure Login</button>
        </form>
    </div>

    <div class="dashboard-container" id="dashboardScreen">
        <main class="chat-area">
            <div class="messages-window" id="messagesWindow"></div>
            <form class="input-bar" onsubmit="sendMessage(event)">
                <input type="text" id="typeBox" placeholder="Type a message..." autocomplete="off" required>
                <button type="submit" class="send-btn">Send</button>
            </form>
        </main>
    </div>

    <script>
        const userCredentials = { 'Eng. Ahmed Nabil': 'Bayan2026', 'Eng. Youssef Nabil': 'Bayan2026', 'Eng. Noha Alhaddad': 'Bayan2026', 'Eng. Nabil Hassan': 'Bayan2026' };
        let currentActiveUser = "", client = null, deviceSessionToken = "dev_" + Math.random().toString(16).substr(2, 8);
        const CHAT_TOPIC = "bayan/company/bct_broadcast_channel_main";

        function handleLogin(event) {
            event.preventDefault();
            const id = document.getElementById('portal-id').value;
            if (userCredentials[id] === document.getElementById('password').value) {
                currentActiveUser = id;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'grid';
                initLiveSync();
            } else { alert("Invalid Password"); }
        }

        function initLiveSync() {
            // Secure WSS connection
            client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { clean: true });
            client.on('connect', () => client.subscribe(CHAT_TOPIC));
            client.on('message', (topic, payload) => {
                const data = JSON.parse(payload.toString());
                if (data.token !== deviceSessionToken) displayMessage(data.user, data.message, false);
            });
        }

        function displayMessage(sender, message, isSelf) {
            const windowObj = document.getElementById('messagesWindow');
            const msgId = 'msg-' + Date.now();
            const html = `<div class="msg ${isSelf ? 'sent' : 'received'}" id="${msgId}">
                ${isSelf ? `<span class="delete-btn" onclick="document.getElementById('${msgId}').remove()">✕</span>` : ''}
                <small style="display:block; font-size:9px">${sender}</small>${message}</div>`;
            windowObj.insertAdjacentHTML('beforeend', html);
            windowObj.scrollTop = windowObj.scrollHeight;
        }

        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('typeBox');
            if (!input.value.trim() || !client.connected) return;
            client.publish(CHAT_TOPIC, JSON.stringify({ token: deviceSessionToken, user: currentActiveUser, message: input.value }));
            displayMessage("You", input.value, true);
            input.value = "";
        }
    </script>
</body>
</html>
