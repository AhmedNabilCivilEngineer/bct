<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAYAN Company (BCT) - Communication Portal</title>
    <!-- MQTT library for keyless, instant global device synchronization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root {
            --primary-gold: #b38f4f;
            --dark-gold: #8e6f37;
            --dark-bg: #111111;
            --card-bg: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --success-green: #2ecc71;
            --error-red: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            padding: 10px;
        }

        html {
            height: -webkit-fill-available;
        }

        .portal-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .dashboard-container {
            display: none;
            background-color: var(--card-bg);
            width: 100%;
            max-width: 900px;
            height: 85vh;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            grid-template-columns: 260px 1fr;
            overflow: hidden;
        }

        .logo-area { margin-bottom: 20px; }
        .logo-icon {
            font-size: 54px;
            font-weight: bold;
            color: var(--primary-gold);
            line-height: 1;
            margin-bottom: 5px;
            font-family: 'Times New Roman', Times, serif;
        }
        .company-name { font-size: 22px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .company-subtext { font-size: 13px; color: var(--primary-gold); letter-spacing: 3px; font-weight: bold; margin-top: 2px; }
        .arabic-text { font-size: 13px; color: var(--text-muted); direction: rtl; margin-top: 10px; line-height: 1.4; }
        .portal-title { font-size: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--primary-gold); margin-bottom: 8px; }
        .input-group select, .input-group input {
            width: 100%; padding: 12px; background-color: #222; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 16px; /* 16px prevents iOS Safari auto-zoom */
        }
        .input-group select:focus, .input-group input:focus { outline: none; border-color: var(--primary-gold); }
        .login-btn {
            width: 100%; padding: 14px; background-color: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .login-btn:hover { background-color: var(--dark-gold); color: #fff; }

        #message-box { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; display: none; }
        .error { background-color: rgba(231, 76, 60, 0.15); color: var(--error-red); border: 1px solid var(--error-red); }

        .sidebar { background-color: #111; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sidebar .mini-logo { font-size: 22px; font-weight: bold; color: var(--primary-gold); margin-bottom: 15px; }
        .user-badge { background: #222; padding: 10px; border-radius: 6px; border-left: 3px solid var(--primary-gold); margin-bottom: 15px; font-size: 13px; }
        
        .channels-list h4 { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px;}
        .channel-item { padding: 10px; border-radius: 6px; background: var(--card-bg); font-size: 13px; color: var(--primary-gold); font-weight: bold; border: 1px solid var(--border-color); margin-bottom: 15px; }
        
        .active-users-box { flex: 1; display: flex; flex-direction: column; margin-bottom: 15px; }
        .active-users-box h4 { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px; }
        .users-list { display: flex; flex-direction: column; gap: 6px; }
        .user-status-item { padding: 8px 12px; background: #1a1a1a; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; }
        .user-status-dot { width: 6px; height: 6px; background: var(--success-green); border-radius: 50%; }

        .logout-btn { padding: 10px; background: transparent; border: 1px solid var(--error-red); color: var(--error-red); border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; min-height: 40px; }
        .logout-btn:hover { background: var(--error-red); color: #fff; }

        .chat-area { display: flex; flex-direction: column; background: #161616; position: relative; }
        .chat-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); font-weight: bold; display: flex; justify-content: space-between; align-items: center;}
        .status-dot { width: 8px; height: 8px; background: var(--success-green); border-radius: 50%; display: inline-block; margin-right: 5px; }
        
        /* Mobile Toggle Button */
        .mobile-toggle-btn { display: none; background: #222; border: 1px solid var(--primary-gold); color: var(--primary-gold); padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }

        .messages-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; line-height: 1.4; font-size: 14px; word-break: break-word; }
        .msg.received { background: #222; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--border-color); }
        .msg.sent { background: var(--primary-gold); color: #111; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 500; }
        .msg-meta { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; display: block; }
        .msg.sent .msg-meta { color: #333; font-weight: bold; }

        .input-bar { padding: 15px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
        .input-bar input { flex: 1; padding: 12px; background: #111; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 16px; }
        .input-bar input:focus { outline: none; border-color: var(--primary-gold); }
        .send-btn { padding: 0 20px; background: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-weight: bold; cursor: pointer; font-size: 15px; }

        /* 📱 RESPONSIVE MOBILE FIXES 📱 */
        @media (max-width: 768px) {
            body { padding: 0; }
            .portal-container { border-radius: 0; border: none; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
            .dashboard-container { grid-template-columns: 1fr; height: 100vh; border-radius: 0; border: none; }
            
            .sidebar { 
                display: none; /* Hidden by default on mobile */
                position: absolute; 
                top: 55px; left: 0; right: 0; bottom: 0; 
                z-index: 10; background: #111; 
            }
            .sidebar.active { display: flex; }
            
            .mobile-toggle-btn { display: block; }
            .chat-header { height: 55px; padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: LOGIN PORTAL -->
    <div class="portal-container" id="loginScreen">
        <div class="logo-area">
            <div class="logo-icon">B</div>
            <div class="company-name">Bayan Company</div>
            <div class="company-subtext">BCT</div>
            <div class="arabic-text">
                شركة بيان للمقاولات والتجارة<br>
                <span style="font-size: 12px;">المهندس أحمد نبيل وشركاؤه</span>
            </div>
        </div>

        <h2 class="portal-title">Secure Communications Portal</h2>

        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="portal-id">Select Portal / Identity</label>
                <select id="portal-id" required>
                    <option value="" disabled selected>-- Select your access level --</option>
                    <option value="BCT-MGMT">Management Portal (ID: BCT-MGMT)</option>
                    <option value="BCT-ENG">Engineering & Projects (ID: BCT-ENG)</option>
                    <option value="BCT-COMM">Commercial & Trading (ID: BCT-COMM)</option>
                    <option value="BCT-HR">HR & Personnel (ID: BCT-HR)</option>
                    <option value="BCT-FIN">Finance & Accounting (ID: BCT-FIN)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="password">Security Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">Secure Login</button>
        </form>

        <div id="message-box"></div>
    </div>

    <!-- SCREEN 2: LIVE COMMUNICATIONS DASHBOARD -->
    <div class="dashboard-container" id="dashboardScreen">
        <aside class="sidebar" id="sidebarMenu">
            <div class="mini-logo">BCT Portal</div>
            <div class="user-badge">
                <span style="color: var(--primary-gold); font-weight: bold;">Active User:</span>
                <div id="displayUser">ID: None</div>
            </div>
            
            <div class="channels-list">
                <h4>Active Channel</h4>
                <div class="channel-item">📢 company-wide</div>
            </div>

            <div class="active-users-box">
                <h4>Online Personnel</h4>
                <div class="users-list" id="presenceList"></div>
            </div>

            <button class="logout-btn" onclick="handleLogout()">Disconnect</button>
        </aside>

        <main class="chat-area">
            <div class="chat-header">
                <button class="mobile-toggle-btn" onclick="toggleMobileMenu()" id="menuToggleBtn">👥 Online Info</button>
                <div id="chatRoomTitle" style="font-size:14px;">Bayan Feed</div>
                <div style="font-size: 12px; color: var(--text-muted);"><span class="status-dot"></span> Secure</div>
            </div>

            <div class="messages-window" id="messagesWindow"></div>

            <form class="input-bar" onsubmit="sendMessage(event)">
                <input type="text" id="typeBox" placeholder="Type a message..." autocomplete="off" required>
                <button type="submit" class="send-btn">Send</button>
            </form>
        </main>
    </div>

    <script>
        const credentials = {
            'BCT-MGMT': 'BayanAdmin2026', 'BCT-ENG': 'BayanEng2026', 'BCT-COMM': 'BayanTrade2026',
            'BCT-HR': 'BayanHR2026', 'BCT-FIN': 'BayanFin2026'
        };

        let currentActiveUser = "";
        let client = null;
        let trackedOnlineUsers = {}; 
        
        const CHAT_TOPIC = "bayan/company/bct_broadcast_channel_main"; 
        const PRESENCE_TOPIC = "bayan/company/presence/";
        const deviceSessionToken = "dev_" + Math.random().toString(16).substr(2, 8);

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebarMenu');
            const btn = document.getElementById('menuToggleBtn');
            sidebar.classList.toggle('active');
            if(sidebar.classList.contains('active')) {
                btn.innerText = "❌ Close Panel";
            } else {
                btn.innerText = "👥 Online Info";
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const selectedId = document.getElementById('portal-id').value;
            const enteredPassword = document.getElementById('password').value;
            const messageBox = document.getElementById('message-box');

            if (credentials[selectedId] === enteredPassword) {
                currentActiveUser = selectedId;
                
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'grid';
                document.getElementById('displayUser').innerText = selectedId;
                document.getElementById('chatRoomTitle').innerText = "🏢 Bayan Broadcast Feed";
                
                initLiveSync();
            } else {
                messageBox.className = "error";
                messageBox.innerHTML = "✗ Invalid Password. Access Denied.";
                messageBox.style.display = "block";
            }
        }

        function initLiveSync() {
            const windowObj = document.getElementById('messagesWindow');
            windowObj.innerHTML = `<div class="msg received"><span class="msg-meta">System</span>Connecting to Bayan Network...</div>`;

            const options = {
                clientId: deviceSessionToken,
                will: {
                    topic: PRESENCE_TOPIC + currentActiveUser + "/" + deviceSessionToken,
                    payload: JSON.stringify({ status: "offline" }),
                    qos: 1,
                    retain: true
                }
            };

            client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', options);

            client.on('connect', () => {
                client.subscribe(CHAT_TOPIC);
                client.subscribe(PRESENCE_TOPIC + "+/+");

                client.publish(
                    PRESENCE_TOPIC + currentActiveUser + "/" + deviceSessionToken, 
                    JSON.stringify({ status: "online" }), 
                    { qos: 1, retain: true }
                );

                windowObj.innerHTML = `<div class="msg received"><span class="msg-meta">System</span>Connected! Live across all company devices.</div>`;
            });

            client.on('message', (topic, payload) => {
                if (topic.startsWith(PRESENCE_TOPIC)) {
                    handlePresenceUpdate(topic, payload.toString());
                    return;
                }

                try {
                    const data = JSON.parse(payload.toString());
                    if (data.token !== deviceSessionToken) {
                        displayIncomingMessage(data.user, data.message, false);
                    }
                } catch (e) {
                    console.error("Malformed package.");
                }
            });
        }

        function handlePresenceUpdate(topic, payloadStr) {
            try {
                const parts = topic.split('/');
                const role = parts[3];
                const session = parts[4];
                const data = JSON.parse(payloadStr);

                if (!trackedOnlineUsers[role]) trackedOnlineUsers[role] = new Set();

                if (data.status === "online") {
                    trackedOnlineUsers[role].add(session);
                } else {
                    trackedOnlineUsers[role].delete(session);
                }

                renderActiveUsersList();
            } catch(e) {}
        }

        function renderActiveUsersList() {
            const container = document.getElementById('presenceList');
            container.innerHTML = "";

            Object.keys(credentials).forEach(role => {
                const isOnline = trackedOnlineUsers[role] && trackedOnlineUsers[role].size > 0;
                if (isOnline) {
                    container.innerHTML += `
                        <div class="user-status-item">
                            <span>${role}</span>
                            <span class="user-status-dot"></span>
                        </div>`;
                }
            });
        }

        function sendMessage(event) {
            event.preventDefault();
            const textInput = document.getElementById('typeBox');
            const text = textInput.value.trim();
            if (text === "" || !client) return;

            displayIncomingMessage("You (" + currentActiveUser + ")", text, true);

            const payload = {
                token: deviceSessionToken,
                user: currentActiveUser,
                message: text
            };
            client.publish(CHAT_TOPIC, JSON.stringify(payload));

            textInput.value = ""; 
        }

        function displayIncomingMessage(sender, message, isSelf = false) {
            const windowObj = document.getElementById('messagesWindow');
            const bubbleClass = isSelf ? "sent" : "received";
            
            windowObj.innerHTML += `
                <div class="msg ${bubbleClass}">
                    <span class="msg-meta">${sender}</span>
                    ${message}
                </div>`;
            scrollChatToBottom();
        }

        function scrollChatToBottom() {
            const windowObj = document.getElementById('messagesWindow');
            windowObj.scrollTop = windowObj.scrollHeight;
        }

        function handleLogout() {
            if (client) {
                client.publish(
                    PRESENCE_TOPIC + currentActiveUser + "/" + deviceSessionToken, 
                    JSON.stringify({ status: "offline" }), 
                    { qos: 1, retain: true }
                );
                client.end();
            }
            document.getElementById('password').value = "";
            document.getElementById('message-box').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('sidebarMenu').classList.remove('active');
            document.getElementById('loginScreen').style.display = 'block';
            currentActiveUser = "";
            trackedOnlineUsers = {};
        }
    </script>
</body>
</html>
