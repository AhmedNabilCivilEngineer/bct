<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAYAN Company (BCT) - Communication Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root {
            --primary-gold: #ffd700;
            --dark-gold: #c5a000;
            --dark-bg: #121212;
            --card-bg: #252525;
            --input-bg: #333333;
            --text-main: #ffffff;
            --text-muted: #bbbbbb;
            --border-color: #555555;
            --success-green: #2ecc71;
            --error-red: #ff5f56;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .portal-container { background-color: var(--card-bg); width: 100%; max-width: 420px; padding: 30px; border-radius: 12px; border: 2px solid var(--border-color); text-align: center; }
        .dashboard-container { display: none; background-color: var(--card-bg); width: 100%; max-width: 900px; height: 85vh; border-radius: 12px; border: 2px solid var(--border-color); grid-template-columns: 260px 1fr; overflow: hidden; }
        .company-name { font-size: 24px; font-weight: 800; color: var(--primary-gold); margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: bold; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
        .input-group select, .input-group input { width: 100%; padding: 14px; background-color: var(--input-bg); border: 2px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 16px; }
        .login-btn { width: 100%; padding: 14px; background-color: var(--primary-gold); border: none; border-radius: 6px; color: #000; font-size: 16px; font-weight: 800; cursor: pointer; }
        .sidebar { background-color: #1a1a1a; border-right: 2px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; }
        .chat-area { display: flex; flex-direction: column; background: #202020; flex: 1; }
        .chat-header { padding: 15px 20px; border-bottom: 2px solid var(--border-color); font-weight: bold; font-size: 18px; }
        .messages-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 10px; font-size: 15px; }
        .msg.received { background: #333; align-self: flex-start; }
        .msg.sent { background: var(--primary-gold); color: #000; align-self: flex-end; font-weight: 600; }
        .input-bar { padding: 15px; background: var(--card-bg); border-top: 2px solid var(--border-color); display: flex; gap: 10px; }
        .input-bar input { flex: 1; padding: 12px; background: var(--input-bg); border: 2px solid var(--border-color); border-radius: 6px; color: #fff; }
        .send-btn { padding: 0 20px; background: var(--primary-gold); border: none; border-radius: 6px; color: #000; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="portal-container" id="loginScreen">
        <h1 class="company-name">BAYAN COMPANY</h1>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Select Identity</label>
                <select id="portal-id" required>
                    <option value="" disabled selected>-- Select Member --</option>
                    <option value="Eng. Ahmed Nabil">Eng. Ahmed Nabil</option>
                    <option value="Eng. Youssef Nabil">Eng. Youssef Nabil</option>
                    <option value="Eng. Noha Alhaddad">Eng. Noha Alhaddad</option>
                    <option value="Eng. Nabil Hassan">Eng. Nabil Hassan</option>
                </select>
            </div>
            <div class="input-group">
                <label>Security Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="login-btn">SECURE LOGIN</button>
        </form>
        <div id="message-box" style="margin-top:15px; color:var(--error-red); display:none;">Invalid Password</div>
    </div>

    <div class="dashboard-container" id="dashboardScreen">
        <aside class="sidebar">
            <div style="font-weight:bold; color:var(--primary-gold); margin-bottom:20px;">BCT PORTAL</div>
            <div id="displayUser" style="margin-bottom:20px; font-size:14px;"></div>
            <button onclick="location.reload()" style="background:transparent; border:1px solid var(--error-red); color:var(--error-red); padding:10px; cursor:pointer;">Disconnect</button>
        </aside>
        <main class="chat-area">
            <div class="chat-header">Bayan Secure Feed</div>
            <div class="messages-window" id="messagesWindow"></div>
            <form class="input-bar" onsubmit="sendMessage(event)">
                <input type="file" id="fileInput" accept="image/*,application/pdf" style="display:none" onchange="handleFileSelection(event)">
                <button type="button" class="send-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="text" id="typeBox" placeholder="Type a message..." autocomplete="off">
                <button type="submit" class="send-btn">Send</button>
            </form>
        </main>
    </div>

    <script>
        const userCredentials = { 'Eng. Ahmed Nabil': 'Bayan2026', 'Eng. Youssef Nabil': 'Bayan2026', 'Eng. Noha Alhaddad': 'Bayan2026', 'Eng. Nabil Hassan': 'Bayan2026' };
        let currentActiveUser = "", client = null;
        const CHAT_TOPIC = "bayan/company/bct_main_feed";

        function handleLogin(event) {
            event.preventDefault();
            const id = document.getElementById('portal-id').value;
            if (userCredentials[id] === document.getElementById('password').value) {
                currentActiveUser = id;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'grid';
                document.getElementById('displayUser').innerText = "User: " + id;
                initMQTT();
            } else {
                document.getElementById('message-box').style.display = "block";
            }
        }

        function initMQTT() {
            client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
            client.on('connect', () => client.subscribe(CHAT_TOPIC));
            client.on('message', (topic, payload) => {
                const data = JSON.parse(payload.toString());
                displayMessage(data.user, data.msg, data.file, data.fileName, false);
            });
        }

        function handleFileSelection(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                client.publish(CHAT_TOPIC, JSON.stringify({ user: currentActiveUser, file: e.target.result, fileName: file.name }));
                displayMessage("You", null, e.target.result, file.name, true);
            };
            reader.readAsDataURL(file);
        }

        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('typeBox');
            if (!input.value.trim()) return;
            client.publish(CHAT_TOPIC, JSON.stringify({ user: currentActiveUser, msg: input.value }));
            displayMessage("You", input.value, null, null, true);
            input.value = "";
        }

        function displayMessage(user, msg, file, fileName, isSelf) {
            const windowObj = document.getElementById('messagesWindow');
            let content = msg ? `<p>${msg}</p>` : "";
            if (file) {
                const isImg = file.startsWith('data:image');
                content += `<a href="${file}" download="${fileName}" style="color:var(--primary-gold); display:block; margin-top:5px; text-decoration:none;">
                    ${isImg ? `<img src="${file}" style="max-width:120px; display:block; border-radius:4px; margin-bottom:5px;">` : "📄 "} ${fileName}
                </a>`;
            }
            windowObj.insertAdjacentHTML('beforeend', `<div class="msg ${isSelf ? 'sent' : 'received'}"><span style="font-size:10px; display:block; opacity:0.7;">${user}</span>${content}</div>`);
            windowObj.scrollTop = windowObj.scrollHeight;
        }
    </script>
</body>
</html>
