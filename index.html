<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAYAN Company (BCT) - Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root {
            --primary-gold: #b38f4f;
            --dark-bg: #111111;
            --card-bg: #1a1a1a;
            --text-light: #ffffff;
            --border-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); height: 100vh; display: flex; justify-content: center; align-items: center; }

        .portal-container { background-color: var(--card-bg); width: 100%; max-width: 420px; padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; }
        .dashboard-container { display: none; width: 100%; max-width: 900px; height: 85vh; background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }

        .messages-window { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 14px; position: relative; word-wrap: break-word; }
        .msg.received { background: #222; align-self: flex-start; border: 1px solid var(--border-color); }
        .msg.sent { background: var(--primary-gold); color: #111; align-self: flex-end; }
        
        .delete-btn { position: absolute; right: 5px; top: 5px; cursor: pointer; color: #000; font-weight: bold; font-size: 12px; display: none; }
        .msg.sent:hover .delete-btn { display: block; }

        .input-bar { padding: 15px; background: #111; border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
        .input-bar input { flex: 1; padding: 12px; background: #222; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; }
        .send-btn { padding: 0 20px; background: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="portal-container" id="loginScreen">
        <h2 style="color: var(--primary-gold); margin-bottom: 20px;">Bayan Portal</h2>
        <form onsubmit="handleLogin(event)">
            <select id="portal-id" style="width:100%; padding:10px; background:#222; color:#fff; border:1px solid #333; margin-bottom:10px;" required>
                <option value="" disabled selected>-- Select Member --</option>
                <option value="Eng. Ahmed Nabil">Eng. Ahmed Nabil</option>
                <option value="Eng. Youssef Nabil">Eng. Youssef Nabil</option>
                <option value="Eng. Noha Alhaddad">Eng. Noha Alhaddad</option>
                <option value="Eng. Nabil Hassan">Eng. Nabil Hassan</option>
            </select>
            <input type="password" id="password" placeholder="Password" style="width:100%; padding:10px; background:#222; color:#fff; border:1px solid #333;" required>
            <button type="submit" class="send-btn" style="width:100%; margin-top:15px; padding:12px;">Login</button>
        </form>
    </div>

    <div class="dashboard-container" id="dashboardScreen">
        <div class="messages-window" id="messagesWindow"></div>
        <form class="input-bar" onsubmit="sendMessage(event)">
            <input type="text" id="typeBox" placeholder="Type a message..." autocomplete="off" required>
            <button type="submit" class="send-btn">Send</button>
        </form>
    </div>

    <script>
        const userCredentials = { 'Eng. Ahmed Nabil': 'Bayan2026', 'Eng. Youssef Nabil': 'Bayan2026', 'Eng. Noha Alhaddad': 'Bayan2026', 'Eng. Nabil Hassan': 'Bayan2026' };
        let currentActiveUser = "", client = null;
        const CHAT_TOPIC = "bayan/company/bct_broadcast_channel_main";

        function handleLogin(event) {
            event.preventDefault();
            const id = document.getElementById('portal-id').value;
            if (userCredentials[id] === document.getElementById('password').value) {
                currentActiveUser = id;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'flex';
                initLiveSync();
            } else { alert("Invalid Password"); }
        }

        function initLiveSync() {
            client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { clean: true });
            client.on('connect', () => client.subscribe(CHAT_TOPIC));
            client.on('message', (topic, payload) => {
                const data = JSON.parse(payload.toString());
                if (data.type === 'delete') {
                    const el = document.getElementById(data.msgId);
                    if (el) el.remove();
                } else {
                    displayMessage(data.user, data.message, false, data.msgId);
                }
            });
        }

        function displayMessage(sender, message, isSelf, msgId) {
            const windowObj = document.getElementById('messagesWindow');
            const html = `<div class="msg ${isSelf ? 'sent' : 'received'}" id="${msgId}">
                ${isSelf ? `<span class="delete-btn" onclick="deleteGlobal('${msgId}')">✕</span>` : ''}
                <small style="display:block; font-size:9px; margin-bottom:2px;">${sender}</small>${message}</div>`;
            windowObj.insertAdjacentHTML('beforeend', html);
            windowObj.scrollTop = windowObj.scrollHeight;
        }

        function deleteGlobal(msgId) {
            client.publish(CHAT_TOPIC, JSON.stringify({ type: 'delete', msgId: msgId }));
        }

        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('typeBox');
            if (!input.value.trim() || !client.connected) return;
            const msgId = 'msg-' + Date.now();
            client.publish(CHAT_TOPIC, JSON.stringify({ type: 'chat', user: currentActiveUser, message: input.value, msgId: msgId }));
            displayMessage("You", input.value, true, msgId);
            input.value = "";
        }
    </script>
</body>
</html>
