<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bayan P2P Secure Transfer</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #222; padding: 20px; border-radius: 8px; width: 100%; max-width: 500px; border: 1px solid #444; }
        textarea { width: 100%; height: 80px; background: #000; color: #b38f4f; border: 1px solid #444; margin: 10px 0; }
        button { background: #b38f4f; border: none; padding: 10px; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Bayan P2P Link (Unlimited Size)</h3>
        <div id="setup">
            <button onclick="createOffer()">1. Create Session</button>
            <textarea id="localSdp" placeholder="Copy this to colleague..."></textarea>
            <textarea id="remoteSdp" placeholder="Paste colleague's code here..."></textarea>
            <button onclick="acceptAnswer()">2. Connect</button>
        </div>
        <input type="file" id="fileInput" onchange="sendFile(this.files[0])" disabled>
        <div id="status">Status: Waiting for connection</div>
    </div>

    <script>
        let pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
        let dc;

        async function createOffer() {
            dc = pc.createDataChannel("fileTransfer");
            setupDataChannel();
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            document.getElementById('localSdp').value = JSON.stringify(offer);
        }

        async function acceptAnswer() {
            const remote = JSON.parse(document.getElementById('remoteSdp').value);
            await pc.setRemoteDescription(remote);
            if(remote.type === 'offer') {
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                document.getElementById('localSdp').value = JSON.stringify(answer);
            }
        }

        pc.ondatachannel = e => { dc = e.channel; setupDataChannel(); };

        function setupDataChannel() {
            dc.onopen = () => { document.getElementById('status').innerText = "Status: Connected - Select file"; document.getElementById('fileInput').disabled = false; };
            dc.onmessage = e => {
                if(typeof e.data === 'string') {
                    const meta = JSON.parse(e.data);
                    // Handle file receipt logic here...
                    alert("Receiving: " + meta.name);
                }
            };
        }

        function sendFile(file) {
            dc.send(JSON.stringify({name: file.name, size: file.size}));
            const reader = new FileReader();
            reader.onload = e => dc.send(e.target.result);
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
