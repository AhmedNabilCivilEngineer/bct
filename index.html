<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAYAN Company (BCT) - Communication Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root {
            --primary-gold: #b38f4f;
            --dark-gold: #8e6f37;
            --dark-bg: #111111;
            --card-bg: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --success-green: #2ecc71;
            --error-red: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; overflow: hidden; }

        .portal-container { background-color: var(--card-bg); width: 100%; max-width: 420px; padding: 30px 20px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); border: 1px solid var(--border-color); text-align: center; }

        .dashboard-container { display: none; background-color: var(--card-bg); width: 100%; max-width: 900px; height: 85vh; border-radius: 12px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); border: 1px solid var(--border-color); grid-template-columns: 260px 1fr; overflow: hidden; }

        .logo-area { margin-bottom: 20px; }
        .logo-icon { font-size: 54px; font-weight: bold; color: var(--primary-gold); line-height: 1; margin-bottom: 5px; font-family: 'Times New Roman', Times, serif; }
        .company-name { font-size: 22px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .company-subtext { font-size: 13px; color: var(--primary-gold); letter-spacing: 3px; font-weight: bold; margin-top: 2px; }
        .portal-title { font-size: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--primary-gold); margin-bottom: 8px; }
        .input-group select, .input-group input { width: 100%; padding: 12px; background-color: #222; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 16px; }
        .login-btn { width: 100%; padding: 14px; background-color: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .login-btn:hover { background-color: var(--dark-gold); color: #fff; }

        #message-box { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; display: none; }
        .error { background-color: rgba(231, 76, 60, 0.15); color: var(--error-red); border: 1px solid var(--error-red); }

        .sidebar { background-color: #111; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .mini-logo { font-size: 22px; font-weight: bold; color: var(--primary-gold); margin-bottom: 15px; }
        .user-badge { background: #222; padding: 10px; border-radius: 6px; border-left: 3px solid var(--primary-gold); margin-bottom: 15px; font-size: 13px; }
        .active-users-box { flex: 1; }
        .users-list { display: flex; flex-direction: column; gap: 6px; }
        .logout-btn { padding: 10px; background: transparent; border: 1px solid var(--error-red); color: var(--error-red); border-radius: 6px; cursor: pointer; }

        .chat-area { display: flex; flex-direction: column; background: #161616; min-height: 0; }
        .chat-header { padding: 15px; border-bottom: 1px solid var(--border-color); font-weight: bold; }
        .messages-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
        .msg.received { background: #222; align-self: flex-start; border: 1px solid var(--border-color); }
        .msg.sent { background: var(--primary-gold); color: #111; align-self: flex-end; }
        .msg-meta { font-size: 10px; color: var(--text-muted); display: block; margin-bottom: 3px; }

        .input-bar { padding: 15px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
        .input-bar input { flex: 1; padding: 12px; background: #111; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; }
        .send-btn { padding: 0 15px; background: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="portal-container" id="loginScreen">
        <div class="logo-area">
            <div class="logo-icon">B</div>
            <div class="company-name">Bayan Company</div>
        </div>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Select Identity</label>
                <select id="portal-id" required>
                    <option value="" disabled selected>-- Select Member --</option>
                    <option value="Eng. Ahmed Nabil">Eng. Ahmed Nabil</option>
                    <option value="Eng. Youssef Nabil">Eng. Youssef Nabil</option>
                    <option value="Eng. Noha Alhaddad">Eng. Noha Alhaddad</option>
                    <option value="Eng. Nabil Hassan">Eng. Nabil Hassan</option>
                </select>
            </div>
            <div class="input-group">
                <label>Security Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="login-btn">Secure Login</button>
        </form>
        <div id="message-box"></div>
    </div>

    <div class="dashboard-container" id="dashboardScreen">
        <aside class="sidebar">
            <div class="mini-logo">BCT Portal</div>
            <div class="user-badge" id="displayUser"></div>
            <div class="active-users-box">
                <h4>Online Personnel</h4>
                <div class="users-list" id="presenceList"></div>
            </div>
            <button class="logout-btn" onclick="location.reload()">Disconnect</button>
        </aside>

        <main class="chat-area">
            <div class="chat-header">Bayan Secure Feed</div>
            <div class="messages-window" id="messagesWindow"></div>
            <form class="input-bar" onsubmit="sendMessage(event)">
                <input type="file" id="fileInput" accept="image/*,application/pdf" style="display:none" onchange="handleFileSelection(event)">
                <button type="button" class="send-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="text" id="typeBox" placeholder="Type a message..." autocomplete="off">
                <button type="submit" class="send-btn">Send</button>
            </form>
        </main>
    </div>

    <script>
        const userCredentials = { 'Eng. Ahmed Nabil': 'Bayan2026', 'Eng. Youssef Nabil': 'Bayan2026', 'Eng. Noha Alhaddad': 'Bayan2026', 'Eng. Nabil Hassan': 'Bayan2026' };
        let currentActiveUser = "", client = null;
        const CHAT_TOPIC = "bayan/company/bct_main_feed";

        function handleLogin(event) {
            event.preventDefault();
            const id = document.getElementById('portal-id').value;
            if (userCredentials[id] === document.getElementById('password').value) {
                currentActiveUser = id;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'grid';
                document.getElementById('displayUser').innerText = "User: " + id;
                initMQTT();
            } else {
                const box = document.getElementById('message-box');
                box.className = "error"; box.innerText = "Invalid Password."; box.style.display = "block";
            }
        }

        function initMQTT() {
            client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
            client.on('connect', () => client.subscribe(CHAT_TOPIC));
            client.on('message', (topic, payload) => {
                const data = JSON.parse(payload.toString());
                displayMessage(data.user, data.msg, data.file, data.fileName, false);
            });
        }

        function handleFileSelection(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const payload = { user: currentActiveUser, file: e.target.result, fileName: file.name };
                client.publish(CHAT_TOPIC, JSON.stringify(payload));
                displayMessage("You", null, e.target.result, file.name, true);
            };
            reader.readAsDataURL(file);
        }

        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('typeBox');
            if (!input.value.trim()) return;
            client.publish(CHAT_TOPIC, JSON.stringify({ user: currentActiveUser, msg: input.value }));
            displayMessage("You", input.value, null, null, true);
            input.value = "";
        }

        function displayMessage(user, msg, file, fileName, isSelf) {
            const windowObj = document.getElementById('messagesWindow');
            let content = msg ? `<p>${msg}</p>` : "";
            if (file) {
                const isImg = file.startsWith('data:image');
                content += `<a href="${file}" download="${fileName}" style="color:var(--primary-gold); display:block; margin-top:5px;">
                    ${isImg ? `<img src="${file}" style="max-width:100px; display:block; margin-bottom:5px;">` : "📄"} ${fileName}
                </a>`;
            }
            windowObj.insertAdjacentHTML('beforeend', `<div class="msg ${isSelf ? 'sent' : 'received'}"><span class="msg-meta">${user}</span>${content}</div>`);
            windowObj.scrollTop = windowObj.scrollHeight;
        }
    </script>
</body>
</html>
